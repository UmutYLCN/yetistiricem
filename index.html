<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Panik yok, yetişir. YouTube ders videolarını günlük ritmine göre dağıtan, hedefine ne zaman yetişeceğini gün gün hesaplayan çalışma planlayıcı." />
    <title>Yetişir — Panik yok, yetişir</title>
    <script>
      // Paints an explicit light/dark override before first paint (no flash).
      // 'system' (no yt_theme key) needs nothing here: the CSS media query
      // alone handles it. Kept in sync by hand with src/lib/theme.ts.
      (function () {
        try {
          var v = localStorage.getItem('yt_theme');
          if (v === 'light' || v === 'dark') document.documentElement.dataset.theme = v;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
